---
- name: Validate host and role settings
  ansible.builtin.import_tasks: validate.yaml

- name: Create the CSM service account
  ansible.builtin.import_tasks: user.yaml

- name: Install the CSM executable
  ansible.builtin.import_tasks: install.yaml

- name: Set up the host for CSM
  ansible.builtin.import_tasks: setup_host.yaml

- name: Configure platform instance mode when requested
  ansible.builtin.import_tasks: instance_backend.yaml

- name: Bootstrap standalone CS2 servers when requested
  ansible.builtin.import_tasks: bootstrap.yaml

- name: Configure Ready Up
  ansible.builtin.import_tasks: readyup.yaml

- name: Preload the shared CS2 installation when requested
  ansible.builtin.import_tasks: preload_game.yaml
